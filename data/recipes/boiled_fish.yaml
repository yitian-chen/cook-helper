steps:
- 鱼片用盐、姜和淀粉拌匀，豆芽煮透放入碗中。
- 炒香豆瓣加水烧开，逐片下鱼煮熟，浇到豆芽上。
- 干辣椒和花椒用热油煸香，连油浇在鱼上。
