steps:
- 小白菜焯熟垫碗，牛肉薄切，用酱油和淀粉拌匀。
- 豆瓣炒香加水煮滚，下牛肉煮熟，连汤倒入碗中。
- 撒切碎干辣椒、蒜和花椒，淋热油。
