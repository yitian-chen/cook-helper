steps:
- 牛肉和蘑菇切末，牛肉焯水后洗净。
- 清水煮开，下牛肉和蘑菇煮熟，加水淀粉勾薄芡。
- 淋入打散的鸡蛋，凝固后加葱、盐和胡椒。
