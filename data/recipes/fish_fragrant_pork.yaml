steps:
- 肉切丝用少许酱油、淀粉上浆，木耳和胡萝卜切丝。
- 先炒肉丝，再下豆瓣、姜蒜、木耳和胡萝卜。
- 加剩余酱油、醋、糖，炒熟后以水淀粉收汁。
